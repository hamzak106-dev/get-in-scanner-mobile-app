# # Define sync rules to control which data is synced to each user
# See the docs: https://docs.powersync.com/usage/sync-rules

# Priority in PowerSync:
# - Lower numbers indicate higher priority (0 is highest)
# - Higher priority buckets are synced first and have data available earlier
# - Prioritization helps ensure the most important data is available immediately
#
# Our Priority Structure:
# - Priority 0: List events (highest priority, sync first)
# - Priority 1: Ongoing events (high priority)
# - Priority 2: Future events In 1 Day Interval (medium priority)
# - Priority 3: Future events (medium priority)

bucket_definitions:
  # User data bucket - syncs personal user information
  # Critical user data with high priority to ensure immediate availability
  by_user_parameter:
    priority: 0  # Highest priority - users need their own data first
    accept_potentially_dangerous_queries: true
    parameters: SELECT user_id FROM creators WHERE creators.user_id = (request.parameters() ->> 'user_id')
    data:
      - SELECT * FROM creators WHERE creators.user_id = bucket.user_id
      - SELECT * FROM pin WHERE pin.user_id = bucket.user_id
      - SELECT * FROM device WHERE device.user_id = bucket.user_id
      - SELECT * FROM events WHERE events.creator_user = bucket.user_id AND is_live = true

      # Manager data bucket - syncs data for event managers
      # Important management data with high priority
      #   by_manager_parameter:
      #     priority: 0  # Highest priority - managers need immediate access to their data
      #     accept_potentially_dangerous_queries: true
      #     parameters: SELECT events.creator_user as user_id FROM events WHERE (request.parameters() ->> 'user_id') in events.manager_ids
      #     data:
      #       - SELECT * FROM creators WHERE creators.user_id = bucket.user_id
      #       - SELECT * FROM pin WHERE pin.user_id = bucket.user_id
      #       - SELECT * FROM device WHERE device.user_id = bucket.user_id

  #   by_manager_event_parameter:
  #     priority: 0  # Highest priority - managers need immediate access to their data
  #     accept_potentially_dangerous_queries: true
  #     parameters: SELECT events.event_id as event_id FROM events WHERE (request.parameters() ->> 'user_id') in events.manager_ids
  #     data:
  #       - SELECT * FROM events WHERE events.event_id = bucket.event_id AND is_live = true


  # Upcoming events bucket - events starting today or tomorrow
  # Highest event priority because these require immediate action
  by_ongoing_events:
    priority: 1  # Very high priority - users need immediate access to upcoming events
    accept_potentially_dangerous_queries: true
    parameters:
      - SELECT event_id FROM events
        WHERE (creator_user = (request.parameters() ->> 'user_id'))
        AND is_live = true
        AND priority = 1
    data:
      #   - SELECT * FROM events WHERE event_id = bucket.event_id
      - SELECT * FROM attendee WHERE event_id = bucket.event_id
      - SELECT * FROM check_in_logs WHERE event_id = bucket.event_id


  # Ongoing events bucket - events that started before today but are still active
  # High priority for events currently happening
  by_upcoming_events:
    priority: 2  # High priority - these events are happening now
    accept_potentially_dangerous_queries: true
    parameters:
      - SELECT event_id FROM events
        WHERE (creator_user = (request.parameters() ->> 'user_id'))
        AND is_live = true
        AND priority = 2
    data:
      #   - SELECT * FROM events WHERE event_id = bucket.event_id
      - SELECT * FROM attendee WHERE event_id = bucket.event_id
      - SELECT * FROM check_in_logs WHERE event_id = bucket.event_id



  # Future events bucket - events starting after tomorrow
  # Medium priority as these are less urgent
  by_future_events:
    priority: 3  # Medium priority - future planning
    accept_potentially_dangerous_queries: true
    parameters:
      - SELECT event_id FROM events
        WHERE (creator_user = (request.parameters() ->> 'user_id'))
        AND is_live = true
        AND priority = 3
    data:
      #   - SELECT * FROM events WHERE event_id = bucket.event_id
      - SELECT * FROM attendee WHERE event_id = bucket.event_id
      - SELECT * FROM check_in_logs WHERE event_id = bucket.event_id


  # Past events bucket - events that have already ended
  # Lowest priority as they're only needed for historical reference
  # We are not loading in device
#   by_past_events:
#     priority: 3  # Lowest priority - historical data syncs last
#     accept_potentially_dangerous_queries: true
#     parameters:
#       - SELECT event_id FROM events
#         WHERE (creator_user = (request.parameters() ->> 'user_id') OR (request.parameters() ->> 'user_id') in events.manager_ids)
#         AND is_live = false
#         AND priority = 4
#     data:
#       - SELECT * FROM events WHERE event_id = bucket.event_id
#       - SELECT * FROM attendee WHERE event_id = bucket.event_id
#       - SELECT * FROM check_in_logs WHERE event_id = bucket.event_id